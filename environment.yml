name: solar-burst-multiview
# conda-forge only, deliberately. Anaconda's `defaults` channel requires a paid
# licence for organisations of FHNW's size, and every dependency here is on
# conda-forge anyway. Install with Miniforge or micromamba, not Miniconda.
channels:
  - conda-forge
dependencies:
  - python=3.10
  - jupyterlab
  - numpy
  - pandas
  - matplotlib
  - astropy
  - sunpy
  - requests
  - pyvo
  - pip
  - pip:
    - stixdcpy          # STIX data client
    - ecallisto-ng      # e-Callisto data access
    - mwalib            # MWA metadata
