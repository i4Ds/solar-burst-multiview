# Sharma et al. 2022 (ApJ 937, 99) reproduction target.
#
# The MWA observation is a 2015-12-03 solar scan set. Note that these obsids are
# NOT in the shared FHNW MWA archive; the only copy we have access to is the
# original working tree under `remote.rohit_root` on calculon, which also holds
# the published intermediate products we validate against.

event:
  name: sharma2022
  date: 2015-12-03
  target: Sun
  reference: 10.3847/1538-4357/ac87fc

# Solar scans, ~300 s apart. All seven exist as calibrated measurement sets, but
# only the six flagged `imaged: true` have a complete 570-timestep FITS series in
# every band; 1133149192 was processed separately and is partial.
observations:
  - obsid: 1133148288
    start_utc: "2015-12-03T03:24:31"
    imaged: true
  - obsid: 1133148592
    start_utc: "2015-12-03T03:29:35"
    imaged: true
  - obsid: 1133148888
    start_utc: "2015-12-03T03:34:31"
    imaged: true
  - obsid: 1133149192
    start_utc: "2015-12-03T03:39:35"
    imaged: false
  - obsid: 1133149488
    start_utc: "2015-12-03T03:44:31"
    imaged: true
  - obsid: 1133149792
    start_utc: "2015-12-03T03:49:35"
    imaged: true
  - obsid: 1133150088
    start_utc: "2015-12-03T03:54:31"
    imaged: true

# Bandpass/gain solutions in `new_ms/cal_soln` all derive from this scan.
calibrator:
  obsid: 1133139776
  start_utc: "2015-12-03T01:02:39"

# MWA coarse channels are 1.28 MHz wide; each band is a pair, so the centre is
# (lo + hi + 1) / 2 * 1.28 MHz. `label` matches the directory and filename stems
# used throughout the original tree.
bands:
  - {channels: "084-085", label: 108MHz, freq_mhz: 108.16}
  - {channels: "093-094", label: 120MHz, freq_mhz: 119.68}
  - {channels: "103-104", label: 133MHz, freq_mhz: 132.48}
  - {channels: "113-114", label: 145MHz, freq_mhz: 145.28}
  - {channels: "125-126", label: 161MHz, freq_mhz: 160.64}
  - {channels: "139-140", label: 179MHz, freq_mhz: 178.56}
  - {channels: "153-154", label: 197MHz, freq_mhz: 196.48}
  - {channels: "169-170", label: 217MHz, freq_mhz: 216.96}
  - {channels: "187-188", label: 239MHz, freq_mhz: 240.00}

# Geometry of the published CASA images, read from a FITS header on calculon.
imaging:
  npix: 1024
  cell_arcsec: 50.0
  projection: SIN
  bunit: Jy/beam
  stokes: I
  cadence_s: 0.5
  timesteps_per_obsid: 570
  # Rayleigh–Jeans with the FITS beam undershoots Sharma's pickled T_B by this
  # factor (measured 9.48 at 108 MHz on frame 0010). Use 1.0 for the literal
  # Mohan & Oberoi (2017) conversion.
  tb_scale: 9.48

# Paper figures rebuilt from staged products. `python -m solarburst.figures`
figures:
  output_dir: figures/sharma2022
  limb_arcmin: 16.0
  fov_arcsec: 2000
  fov_fig5_arcsec: 2500
  cmap: jet
  fig3:
    # Time-median of Tb_new/Tb_*.p over the six fully-imaged scans. Mean is
    # unusable at 197 and 240 MHz (a few hundred-MK frames). Omit 161 MHz
    # (channels 125-126), which the paper left out of Figure 3.
    reduce: median
    omit_channels: ["125-126"]
    skip_obsids: [1133149192]
    vmin_mk: 0.0
    vmax_mk: 0.40
    paper_peak_mk: [0.26, 0.30, 0.32, 0.34, 0.37, 0.40, 0.44, 0.47]
    paper_mhz: [108, 120, 133, 145, 179, 197, 217, 240]
  fig5:
    # Pickle frame 0 = 1133148288_*.0008 = 03:24:36.5–03:24:37.0 UT.
    obsid: 1133148288
    frame: 0
    fits_index: "0008"
    time_utc: "2015-12-03T03:24:36.75"
    channels: ["084-085", "139-140", "187-188"]
    labels: ["108 MHz", "179 MHz", "240 MHz"]
    colors: ["#d62728", "#2ca02c", "#1f77b4"]
    contour_k: 2.0e4
    residual_threshold_k: 4500.0
    mask_outside_radio_sun: true
  fig7:
    npix: 200
    cell_arcsec: 25.0
    nsigma_time: 6.0
    nsigma_map: 5.0
    min_pix: 3
  fig9:
    aia: aia.lev1.193A_2015-12-03T03_40_29.84Z.image_lev1.fits
    aia_npix: 800
    fov_arcsec: 1800
    region_radius_arcsec: 90
    # PSF-sized boxes from Figure 9 (Solar X, Y in arcsec). Region 1 is the
    # brightest compact source at 240 MHz; 2/3 the limbs; 4 emerging AR;
    # 5 quiet Sun; 6 off-limb but inside the radio disk.
    regions:
      - {id: 1, x: 650, y: -250}
      - {id: 2, x: 850, y: 450}
      - {id: 3, x: -900, y: 150}
      - {id: 4, x: -150, y: 350}
      - {id: 5, x: -200, y: -450}
      - {id: 6, x: -1150, y: -750}
  fig11: {}
  fig12: {}

remote:
  host: calculon.informatik.fhnw.ch
  user: andre_csillaghy
  # Rohit Sharma's working tree - read-only for us, and the only source of the
  # 2015-12-03 data.
  rohit_root: /mnt/nas05/data02/rohit
  paths:
    fits: 20151203_MWA/new_ms/fits
    fits_residual: 20151203_MWA/new_ms/fits_residual
    cal_soln: 20151203_MWA/new_ms/cal_soln
    ms_by_band: 20151203_MWA/new_ms          # <label>/<obsid>_<channels>.ms
    subtraction: 20151203_sub                # <label>/<obsid>_<channels>_chan*.ms
    brightness_temp: 20151203_MWA/Tb_new
    dynamic_spectra: 20151203_MWA/new_vis
    forward: 20151203_forward
    euv: 20151203_EUV
    lasco: 20151203_LASCO
  # Converted measurement sets for the 2022-2025 solar programme, including 347
  # obsids in calendar 2024. Not used for this reproduction.
  shared_archive: /mnt/nas05/data02/MWA_data/data/mwa_data

# Trees to stage for Phases 1–4, in priority order. Together ~1.02 TiB; omit
# `new_vis` (2.0 TB) and the full-resolution `new_ms/<band>/` measurement sets.
# `python -m solarburst.stage --bulk`
stage:
  - 20151203_sub                         # 396G  subtraction workspace
  - 20151203_MWA/new_ms/fits             # 265G  published images
  - 20151203_MWA/Tb_new                  #  47G  brightness-temperature pickles
  - 20151203_MWA/new_ms/cal_soln         # 3.4M  bandpass/gain solutions
  - 20151203_forward                     # 1.9G  PSIMAS/FORWARD models
  - 20151203_EUV                         #  10G  AIA 193 Å
  - 20151203_LASCO                       #  65M  coronagraph
  - 20151203_MWA/new_ms/fits_residual    # 143G  residual images
  - 20151203_selfcal                     # 159G  self-cal products

# The subtraction ground truth: `input` is what Sharma fed to CASA `subvs` and
# `expected` is what came out. The logs (casa-20200523-045753.log) show
#   subvs(..., mode="linear", subtime1="03:24:33~03:29:29", ...)
# i.e. a scan-long complex mean including flagged samples, not the 15 s running
# median described in the paper. `method: scan_mean` matches the MS; use
# `running_median` for the published algorithm.
validation:
  subtraction:
    band: 161MHz
    obsid: 1133148288
    channels: "125-126"
    input: 20151203_sub/161MHz/1133148288_125-126_chan.ms
    expected: 20151203_sub/161MHz/1133148288_125-126_chan_sub.ms
    method: scan_mean
    include_flagged: true
    window_s: 15.0
    clip_sigma: 5.0
